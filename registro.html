<main class="auth-page">
  <div class="container">
    <section class="form-card">
      <h1 class="form-card__title">Regístrate</h1>
      <p class="form-card__description">Necesitamos que te registres para poder acceder a nuestra academia.</p>

      <form class="form" action="" name="registro" method="post" enctype="multipart/form-data">

        <div class="form__group">
          <label class="form__label" for="nombre">Nombre completo:</label>
          <input class="form__input" type="text" id="nombre" name="nombre" maxlength="50" required>
        </div>

        <div class="form__group">
          <label class="form__label" for="data">Fecha de nacimiento:</label>
          <input class="form__input" type="date" id="data" name="fecha_nacimiento">
        </div>

        <div class="form__group">
          <label class="form__label" for="email">Email:</label>
          <input class="form__input" type="email" id="email" name="email" maxlength="50" required>
        </div>

        <div class="form__group">
          <label class="form__label" for="address">Dirección:</label>
          <input class="form__input" type="text" id="address" name="direccion">
        </div>

        <div class="form__group">
          <label class="form__label" for="web">Página web:</label>
          <input class="form__input" type="url" id="web" name="web">
        </div>

        <div class="form__group">
          <label class="form__label" for="photo">Foto:</label>
        <input class="form__file" type="file" id="photo" name="foto">
        </div>

        <div class="form__group form__group--full">
          <label class="form__label" for="biografia">Biografía:</label>
          <textarea class="form__textarea" name="biografia" id="biografia" rows="5" placeholder="Escribe tu biografía"></textarea>
        </div>

        <button class="btn btn--primary" type="submit">Enviar</button>

      </form>
    </section>
  </div>
</main>
