<body>
  <header class="header">
  <a class="header__logo" href="index.html">
    <img width="150" height="14" src="img/common/logotipo_conquer_crypto.png" alt="Logotipo Conquer Blocks" class="header__logo-img">
  </a>

  <input type="checkbox" id="menu-toggle" class="header__checkbox" aria-label="Abrir o cerrar menú">

  <label for="menu-toggle" class="header__hamburger">
    <span class="header__hamburger-bar"></span>
    <span class="header__hamburger-bar"></span>
    <span class="header__hamburger-bar"></span>
  </label>

  <nav class="header__nav" id="primary-navigation">
    <ul class="header__menu">
      <li class="header__item"><a class="header__link" href="index.html">Home</a></li>

  </nav>

</header>

<main class="auth-page">
  <div class="container">
    <section class="form-card form-card--login">
      <h1 class="form-card__title">Inicio de sesión</h1>
    
      <form class="form form--login" action="" method="post">
        <fieldset class="form__fieldset">
          <legend class="form__legend"><strong>Introduce tu usuario y contraseña</strong></legend>

          <div class="form__group">
            <label class="form__label" for="user">Usuario: </label> 
            <input class="form__input" type="email" id="user" name="usuario" autocomplete="username" required>
          </div>

          <div class="form__group">
            <label class="form__label" for="password">Contraseña: </label>
            <input class="form__input" type="password" id="password" name="contraseña" autocomplete="current-password" required>
          </div>

          <button class="btn btn--primary" type="submit">Enviar</button>
        </fieldset>
    </form>
  </section>
  </div>
</main>

<footer class="footer">
  <p class="footer__copy">© Conquer Blocks 2026 - <a class="footer__link" href="aviso-legal.html">Aviso legal</a></p>
