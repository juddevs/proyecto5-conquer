</header>

<main class="contact-page">
  <div class="container">
    <h1 class="contact-page__title">Contacta con nosotros</h1>

    <section class="contact-map">
      <iframe class="contact-map__iframe" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d194348.23369164893!2d-3.8443458807353976!3d40.437837282503054!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd422997800a3c81%3A0xc436dec1618c2269!2sMadrid!5e0!3m2!1ses!2ses!4v1787027154767!5m2!1ses!2ses" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </section>

    <section class="contact-form">
      <h2 class="contact-form__title">Contáctanos</h2>
      <p class="contact-form__description">Contacta con nosotros y haznos las consultas que necesites</p>
      
      <form class="form--contact" action="" method="post">
      
        <div class="form__group">
          <label class="form__label" for="name">Nombre completo: </label>
          <input class="form__input" type="text" id="name" name="name" required>
        </div>

        <div class="form__group">
          <label class="form__label" for="telefono">Teléfono: </label>
          <input class="form__input" type="tel" id="telefono" name="telefono">
        </div>

        <div class="form__group">
          <label class="form__label" for="email">Email: </label>
          <input class="form__input" type="email" id="email" name="email" required>
        </div>

        <div class="form__group">
          <label class="form__label" for="mensaje">Mensaje:</label>
          <textarea class="form__textarea" name="mensaje" id="mensaje" cols="50" rows="8" placeholder="Escribe tu mensaje"></textarea>
        </div> 

        <div class="form__group form__group--checkbox">
          <label class="form__checkbox-label">
            <input class="form__checkbox" type="checkbox" name="condiciones" required>
            Acepto los 
            <a class="link" href="aviso-legal.html">Términos y Condiciones</a>
          </label>
        </div>

        <button class="btn btn--primary" type="submit">Enviar</button>

      </form>
    </section>
  </div>
</main>
